
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AIToday | Article</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f4f7fb;
    color: #263246;
    font-family: 'DM Sans', sans-serif;
    line-height: 1.8;
}

header {
    background: #101d32;
    color: white;
    padding: 24px;
    text-align: center;
}

header a {
    color: white;
    text-decoration: none;
}

header h1 {
    font-family: 'Playfair Display', serif;
    margin: 0;
}

header span { color: #65a9e2; }

main {
    max-width: 850px;
    margin: 40px auto;
    padding: 40px;
    background: white;
    border-radius: 8px;
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    color: #101d32;
    line-height: 1.4;
}

main img {
    max-width: 100%;
    height: auto;
}

main a { color: #1769aa; }

main pre {
    overflow-x: auto;
    padding: 16px;
    background: #101d32;
    color: white;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #1769aa;
    font-weight: bold;
    text-decoration: none;
}

#status { color: #687386; }

footer {
    background: #101d32;
    color: white;
    padding: 25px;
    text-align: center;
}

@media(max-width: 600px) {
    main {
        margin: 15px;
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html">
        <h1>AI<span>Today</span></h1>
    </a>
    <p>Understand Technology. Explore Tomorrow.</p>
</header>

<main>
    <a href="index.html" class="back">← Back to AIToday</a>

    <p id="status">Loading article...</p>
    <article id="content"></article>
</main>

<footer>
    © 2026 AIToday. All Rights Reserved.
</footer>

<script>
async function loadArticle() {
    const filename = new URLSearchParams(location.search).get("file");
    const status = document.getElementById("status");
    const content = document.getElementById("content");

    if (!filename || !/^[a-zA-Z0-9._-]+\.md$/.test(filename)) {
        status.textContent = "Invalid article filename.";
        return;
    }

    try {
        const url =
            "https://raw.githubusercontent.com/swathi25-git/AITODAY/main/articles/"
            + encodeURIComponent(filename);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Article not found");
        }

        const markdown = await response.text();
        const html = marked.parse(markdown);

        content.innerHTML = DOMPurify.sanitize(html);
        status.textContent = "";

        const title = content.querySelector("h1");
        if (title) document.title = title.textContent + " | AIToday";

    } catch (error) {
        status.textContent =
            "Unable to load this article. Please check that it exists in the articles folder.";
    }
}

loadArticle();
</script>

</body>
</html>
