
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIToday | Article</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #f8fafc;
            color: #20242b;
            font-family: 'DM Sans', sans-serif;
            line-height: 1.8;
        }

        header {
            background: #101820;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
        }

        header a {
            color: #93c5fd;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 8px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: #172b4d;
        }

        img {
            max-width: 100%;
        }

        pre {
            overflow-x: auto;
            background: #f1f5f9;
            padding: 15px;
        }

        blockquote {
            border-left: 4px solid #1769aa;
            padding-left: 20px;
            color: #64748b;
        }

        #status {
            text-align: center;
            color: #64748b;
        }

        @media(max-width: 600px) {
            main {
                margin: 15px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>AIToday</h1>
    <p>Understand Technology. Explore Tomorrow.</p>
    <a href="index.html">← Back to Home</a>
</header>

<main>
    <p id="status">Loading article...</p>
    <article id="article-content"></article>
</main>

<script>
async function loadArticle() {
    const filename = new URLSearchParams(window.location.search)
        .get("file");

    const status = document.getElementById("status");
    const content = document.getElementById("article-content");

    if (!filename || !/^[a-zA-Z0-9._-]+\.md$/i.test(filename)) {
        status.textContent = "Invalid article filename.";
        return;
    }

    const url =
        "https://raw.githubusercontent.com/swathi25-git/AITODAY/main/articles/"
        + encodeURIComponent(filename);

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Article not found.");
        }

        const markdown = await response.text();

        const html = marked.parse(markdown);

        content.innerHTML = DOMPurify.sanitize(html);

        const heading = content.querySelector("h1");

        if (heading) {
            document.title = heading.textContent + " | AIToday";
        }

        status.remove();

    } catch (error) {
        status.textContent =
            "Unable to load article. Please try again later.";
        console.error(error);
    }
}

loadArticle();
</script>

</body>
</html>
